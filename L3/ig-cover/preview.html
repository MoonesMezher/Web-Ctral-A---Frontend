<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG Cover — 1080 × 1350</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 44px 24px 64px;
    background: #E9EDF5; display: flex; flex-direction: column;
    align-items: center; gap: 20px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #101828;
  }
  .bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .meta { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #164BFF; color: #fff; font: 500 14px/1 'IBM Plex Sans', sans-serif;
    padding: 13px 22px; border-radius: 10px; transition: filter .18s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .6; cursor: progress; }
  .frame {
    width: 1080px; height: 1350px; flex: 0 0 auto; overflow: hidden;
    background: #fff; border-radius: 2px;
    box-shadow: 0 30px 80px -28px rgba(16,24,40,.38);
  }
  .frame svg { display: block; width: 1080px; height: 1350px; }
  @media (max-width: 1160px) {
    body { padding: 24px 16px 40px; }
    .frame {
      width: calc(100vw - 32px); height: calc((100vw - 32px) * 1.25);
      box-shadow: 0 18px 44px -22px rgba(16,24,40,.34);
    }
    .frame svg { width: 100%; height: 100%; }
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="meta">Instagram cover · 1080 × 1350</span>
    <button id="dl" type="button">Download PNG</button>
  </div>
  <div class="frame" id="frame"></div>

<script>
const SRC = './cover.svg';
const W = 1080, H = 1350;
const frame = document.getElementById('frame');
const btn = document.getElementById('dl');

const FONT_CSS_URL = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap';

function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

let fontCssPromise = null;

/** Google Fonts CSS with every woff2 inlined as a data URI, so it works inside an <img>. */
function embeddedFontCss() {
  if (fontCssPromise) return fontCssPromise;
  fontCssPromise = (async () => {
    let css = await (await fetch(FONT_CSS_URL)).text();
    const urls = [...new Set([...css.matchAll(/url\((https:\/\/[^)]+?\.woff2[^)]*)\)/g)].map(m => m[1]))];
    await Promise.all(urls.map(async url => {
      const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());
      css = css.split(url).join('data:font/woff2;base64,' + toBase64(bytes));
    }));
    return css;
  })();
  return fontCssPromise;
}

/** Inline SVG: strip the @import and put the embedded @font-face block in its place. */
async function inlinedSvg() {
  const raw = await (await fetch(SRC)).text();
  const css = await embeddedFontCss();
  return raw
    .replace(/@import\s+url\([^)]+\)\s*;?/, '')
    .replace('</defs>', '<style>' + css + '</style></defs>');
}

(async () => {
  frame.innerHTML = await inlinedSvg();
})().catch(err => {
  console.error(err);
  frame.innerHTML = '<img src="' + SRC + '" width="1080" height="1350" alt="cover">';
});

btn.onclick = async () => {
  btn.disabled = true;
  btn.textContent = 'Rendering…';
  try {
    const svg = await inlinedSvg();
    const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.src = url;
    await img.decode();

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#F5F7FC';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);

    const png = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const link = document.createElement('a');
    link.href = URL.createObjectURL(png);
    link.download = 'ig-cover-1080x1350.png';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 5000);
    btn.textContent = 'Saved ✓';
  } catch (err) {
    console.error(err);
    btn.textContent = 'Export failed';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Download PNG'; }, 1800);
};
</script>
</body>
</html>
