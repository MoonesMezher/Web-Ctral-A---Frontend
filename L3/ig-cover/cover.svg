<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"
     aria-label="Instagram cover slide — software engineer and technical partner">
  <title>شو بصير لما تختارني مطوّر وشريك تقني لمشروعك؟</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap');
      .ar { font-family: 'IBM Plex Sans Arabic', 'Noto Naskh Arabic', 'Segoe UI', Tahoma, sans-serif; direction: rtl; }
      .en { font-family: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#FAFBFE"/>
      <stop offset="1" stop-color="#F5F7FC"/>
    </linearGradient>

    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#101828" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.34" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1080" height="1350" fill="url(#gridFade)"/></mask>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#164BFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#164BFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#164BFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#8FA4FF"/>
      <stop offset="0.42" stop-color="#164BFF"/>
      <stop offset="1" stop-color="#08239B"/>
    </radialGradient>

    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164BFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#164BFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="cardShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <filter id="chipShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#101828" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="1010" cy="30" r="400" fill="url(#glow)" opacity="0.38"/>

  <!-- top bar -->
  <rect x="86" y="70" width="24" height="24" rx="7" fill="none" stroke="#101828" stroke-opacity="0.22" stroke-width="1.6"/>
  <rect x="94" y="78" width="24" height="24" rx="7" fill="#164BFF"/>
  <text class="en" x="992" y="88" text-anchor="end" font-size="13" font-weight="500" letter-spacing="2.4"
        fill="#101828" fill-opacity="0.60">SOFTWARE ENGINEERING • TECHNICAL PARTNERSHIP</text>
  <line x1="88" y1="126" x2="992" y2="126" stroke="#101828" stroke-opacity="0.10" stroke-width="1"/>

  <!-- headline -->
  <g class="ar" xml:lang="ar">
    <text x="992" y="262" direction="rtl" text-anchor="start"
          font-size="68" font-weight="600" fill="#101828">شو بصير لما تختارني</text>
    <text x="992" y="378" direction="rtl" text-anchor="start"
          font-size="88" font-weight="700" fill="#164BFF">مطوّر وشريك تقني</text>
    <text x="992" y="472" direction="rtl" text-anchor="start"
          font-size="68" font-weight="600" fill="#101828">لمشروعك؟</text>
  </g>

  <!-- illustration -->
  <g id="illustration">
    <!-- architecture tree (back layer) -->
    <g stroke="#101828" stroke-opacity="0.16" stroke-width="1.5" fill="none">
      <path d="M812 618V648H716V660"/>
      <path d="M812 648H908V660"/>
      <path d="M812 648V700H670V734"/>
    </g>
    <rect x="788" y="574" width="48" height="44" rx="12" fill="#164BFF"/>
    <path d="M812 588l8 8-8 8-8-8z" fill="#FFFFFF"/>
    <g fill="#FFFFFF" stroke="#101828" stroke-opacity="0.14" stroke-width="1.5">
      <rect x="692" y="660" width="48" height="44" rx="12"/>
      <rect x="788" y="660" width="48" height="44" rx="12"/>
      <rect x="884" y="660" width="48" height="44" rx="12"/>
      <rect x="646" y="734" width="48" height="44" rx="12"/>
    </g>
    <g fill="#101828" fill-opacity="0.20">
      <rect x="704" y="679" width="24" height="3" rx="1.5"/>
      <rect x="800" y="679" width="24" height="3" rx="1.5"/>
      <rect x="896" y="679" width="24" height="3" rx="1.5"/>
      <rect x="658" y="753" width="24" height="3" rx="1.5"/>
    </g>

    <!-- idea orb -->
    <circle cx="300" cy="748" r="216" fill="url(#glow)"/>
    <circle cx="300" cy="748" r="158" fill="none" stroke="#164BFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="300" cy="748" r="118" fill="none" stroke="#164BFF" stroke-opacity="0.18" stroke-width="1.5"
            stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="300" cy="748" r="76" fill="none" stroke="#164BFF" stroke-opacity="0.26" stroke-width="1.5"/>
    <circle cx="300" cy="748" r="52" fill="url(#orb)"/>
    <circle cx="300" cy="748" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
    <!-- spark -->
    <path d="M300 726c3 16 7 20 23 23-16 3-20 7-23 23-3-16-7-20-23-23 16-3 20-7 23-23z" fill="#FFFFFF"/>
    <circle cx="390" cy="672" r="5" fill="#164BFF"/>

    <!-- code snippet -->
    <g transform="translate(96 952) rotate(-4)" filter="url(#cardShadow)">
      <rect width="236" height="132" rx="18" fill="#101828"/>
      <rect x="24" y="28" width="62" height="9" rx="4.5" fill="#164BFF"/>
      <rect x="94" y="28" width="34" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.26"/>
      <rect x="40" y="52" width="86" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.17"/>
      <rect x="40" y="76" width="128" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.10"/>
      <rect x="40" y="100" width="54" height="9" rx="4.5" fill="#FFFFFF" fill-opacity="0.17"/>
      <rect x="102" y="100" width="46" height="9" rx="4.5" fill="#164BFF" fill-opacity="0.72"/>
    </g>

    <!-- flow: idea -> planning -> architecture -> build -> product -->
    <path d="M384 794C412 796 430 800 450 806C486 816 512 862 536 900
             C562 942 584 972 612 1000C648 1036 664 1058 700 1076"
          fill="none" stroke="#164BFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

    <!-- workflow nodes -->
    <circle cx="450" cy="806" r="17" fill="#FFFFFF" stroke="#164BFF" stroke-width="1.8"/>
    <text class="en" x="450" y="811" text-anchor="middle" font-size="11" font-weight="600"
          letter-spacing="0.5" fill="#164BFF">01</text>

    <circle cx="536" cy="900" r="17" fill="#FFFFFF" stroke="#164BFF" stroke-width="1.8"/>
    <text class="en" x="536" y="905" text-anchor="middle" font-size="11" font-weight="600"
          letter-spacing="0.5" fill="#164BFF">02</text>

    <circle cx="612" cy="1000" r="17" fill="#FFFFFF" stroke="#164BFF" stroke-width="1.8"/>
    <path d="M604 1000l5 5 9-11" fill="none" stroke="#164BFF" stroke-width="2.3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text class="en" x="642" y="978" font-size="11" font-weight="600" letter-spacing="1.6"
          fill="#101828" fill-opacity="0.34">BUILD</text>

    <text class="en" x="186" y="590" font-size="11" font-weight="600" letter-spacing="1.6"
          fill="#101828" fill-opacity="0.34">IDEA</text>

    <!-- floating UI component -->
    <g filter="url(#chipShadow)">
      <rect x="706" y="884" width="132" height="70" rx="16" fill="#FFFFFF"/>
      <rect x="722" y="901" width="36" height="18" rx="9" fill="#164BFF"/>
      <circle cx="749" cy="910" r="7" fill="#FFFFFF"/>
      <rect x="722" y="931" width="52" height="6" rx="3" fill="#101828" fill-opacity="0.11"/>
      <rect x="780" y="931" width="30" height="6" rx="3" fill="#101828" fill-opacity="0.06"/>
    </g>

    <!-- finished product -->
    <g filter="url(#cardShadow)">
      <rect x="660" y="1056" width="332" height="180" rx="22" fill="#FFFFFF"/>
      <circle cx="688" cy="1080" r="4" fill="#101828" fill-opacity="0.12"/>
      <circle cx="702" cy="1080" r="4" fill="#101828" fill-opacity="0.12"/>
      <circle cx="716" cy="1080" r="4" fill="#101828" fill-opacity="0.12"/>
      <rect x="744" y="1074" width="104" height="8" rx="4" fill="#101828" fill-opacity="0.07"/>
      <line x1="660" y1="1098" x2="992" y2="1098" stroke="#101828" stroke-opacity="0.06" stroke-width="1"/>

      <path d="M688 1208v-16l32-28 32 12 32-40 32 16 32-32 32 12 32-30 32 12v94z" fill="url(#area)"/>
      <polyline points="688,1192 720,1164 752,1176 784,1136 816,1152 848,1120 880,1132 912,1102 944,1114"
                fill="none" stroke="#164BFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="688" y1="1208" x2="944" y2="1208" stroke="#101828" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="944" cy="1114" r="6" fill="#FFFFFF" stroke="#164BFF" stroke-width="3"/>
    </g>
  </g>

  <!-- footer -->
  <line x1="88" y1="1272" x2="992" y2="1272" stroke="#101828" stroke-opacity="0.10" stroke-width="1"/>
  <text class="ar" x="992" y="1312" direction="rtl" text-anchor="start" xml:lang="ar"
        font-size="21" font-weight="500" fill="#101828" fill-opacity="0.55">اسحب لتعرف كيف منشتغل</text>
  <path d="M748 1296h-26m8-8-8 8 8 8" fill="none" stroke="#101828" stroke-opacity="0.40" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
