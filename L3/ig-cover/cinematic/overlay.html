<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic cover — 1080 × 1350 compositor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #101828;
    --blue: #164BFF;
    --gold: #E9B872;
    --paper: #F5F7FC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0B0F19;
    color: #E7EAF3;
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; padding: 26px 18px 40px;
  }
  header { display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
  .title { font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; opacity: .5; }

  .stage-wrap {
    position: relative;
    padding: 10px;
    border-radius: 6px;
    background: #0F1522;
    box-shadow: 0 34px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.05);
  }
  canvas {
    display: block;
    height: min(70vh, 1080px);
    width: auto;
    border-radius: 2px;
    background: #070A12;
  }
  .stage-wrap.dragover { box-shadow: 0 0 0 2px var(--gold), 0 34px 90px -30px rgba(0,0,0,.9); }

  .empty {
    position: absolute; inset: 10px; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; color: rgba(231,234,243,.45);
    transition: opacity .2s ease;
  }
  .empty strong { font-weight: 500; font-size: 15px; color: rgba(231,234,243,.72); }
  .empty span { font-size: 12.5px; max-width: 34ch; line-height: 1.7; }
  .empty.hide { opacity: 0; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px 14px; max-width: 900px;
  }
  button {
    appearance: none; border: 0; cursor: pointer;
    font: 500 13px/1 'IBM Plex Sans Arabic', system-ui, sans-serif;
    padding: 12px 18px; border-radius: 999px;
    background: rgba(255,255,255,.07); color: #E7EAF3;
    transition: background .16s ease, color .16s ease;
  }
  button:hover { background: rgba(255,255,255,.13); }
  button.primary { background: var(--gold); color: #1A1206; }
  button.primary:hover { background: #F2C786; }
  button:disabled { opacity: .55; cursor: progress; }

  label.field {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; opacity: .7;
  }
  input[type=range] { width: 110px; accent-color: var(--gold); }
  input[type=file] { display: none; }

  .swatches { display: inline-flex; gap: 7px; }
  .swatch {
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    border: 0; cursor: pointer; outline: 1.5px solid transparent; outline-offset: 3px;
  }
  .swatch[aria-pressed="true"] { outline-color: rgba(255,255,255,.85); }

  .hint { font-size: 11.5px; opacity: .35; text-align: center; max-width: 60ch; line-height: 1.7; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <span class="title">Cinematic cover · 1080 × 1350</span>
  </header>

  <div class="stage-wrap" id="wrap">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <div class="empty" id="empty">
      <strong>Drop the generated frame here</strong>
      <span>4:5 portrait, ideally 1080 × 1350 or larger. The headline, scrim and grain are drawn on top and exported at full size.</span>
    </div>
  </div>

  <div class="controls">
    <label class="field">
      <button type="button" id="pick">Load frame</button>
      <input type="file" id="file" accept="image/*">
    </label>

    <label class="field">Scrim
      <input type="range" id="scrim" min="0" max="100" value="72">
    </label>

    <label class="field">Grain
      <input type="range" id="grain" min="0" max="100" value="45">
    </label>

    <label class="field">Accent
      <span class="swatches" id="swatches">
        <button class="swatch" type="button" data-accent="gold"  aria-pressed="true"  style="background:#E9B872" aria-label="Warm gold"></button>
        <button class="swatch" type="button" data-accent="blue"  aria-pressed="false" style="background:#4C74FF" aria-label="Electric blue"></button>
        <button class="swatch" type="button" data-accent="white" aria-pressed="false" style="background:#FFFFFF" aria-label="White"></button>
      </span>
    </label>

    <label class="field">
      <input type="checkbox" id="swipe"> Swipe hint
    </label>

    <button type="button" class="primary" id="save">Download PNG</button>
  </div>

  <p class="hint">Everything is rasterised at exactly 1080 × 1350. Arabic is set RTL with right alignment, never letter-spaced.</p>

<script>
const W = 1080, H = 1350;
const MARGIN = 96;

const CFG = {
  scrim: 0.72,
  grain: 0.45,
  accent: '#E9B872',
  swipe: false,
  headline: [
    { text: 'شو بصير لما تختارني', size: 62, weight: 600, baseline: 306, color: '#FFFFFF', alpha: 0.97 },
    { text: 'مطوّر وشريك تقني',    size: 82, weight: 700, baseline: 412, color: 'accent',  alpha: 1 },
    { text: 'لمشروعك؟',           size: 62, weight: 600, baseline: 498, color: '#FFFFFF', alpha: 0.97 },
  ],
  label: 'SOFTWARE ENGINEERING — TECHNICAL PARTNERSHIP',
  swipeText: 'اسحب لتعرف كيف منشتغل',
};

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const empty = document.getElementById('empty');

let frame = null;          // source image
let noise = null;          // cached grain tile

/* ---------- grain tile ---------- */
function noiseTile() {
  if (noise) return noise;
  const n = 160;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  noise = ctx.createPattern(c, 'repeat');
  return noise;
}

/* ---------- photo, cover-fit ---------- */
function drawCover(img) {
  const scale = Math.max(W / img.width, H / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  ctx.save();
  ctx.filter = 'contrast(1.06) saturate(0.93) brightness(0.96)';
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
}

function drawPlaceholder() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#0B1220');
  g.addColorStop(0.55, '#111A2C');
  g.addColorStop(1, '#070A12');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

/* ---------- atmosphere ---------- */
function drawVignette() {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.46, H * 0.18, W * 0.5, H * 0.5, H * 0.78);
  g.addColorStop(0, 'rgba(6,10,24,0)');
  g.addColorStop(0.62, 'rgba(6,10,24,0.16)');
  g.addColorStop(1, 'rgba(4,7,16,0.62)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawScrims() {
  const s = CFG.scrim;
  const top = ctx.createLinearGradient(0, 0, 0, H * 0.66);
  top.addColorStop(0, `rgba(5,8,18,${0.86 * s})`);
  top.addColorStop(0.34, `rgba(5,8,18,${0.52 * s})`);
  top.addColorStop(0.68, `rgba(5,8,18,${0.14 * s})`);
  top.addColorStop(1, 'rgba(5,8,18,0)');
  ctx.fillStyle = top;
  ctx.fillRect(0, 0, W, H * 0.66);

  const bot = ctx.createLinearGradient(0, H, 0, H * 0.78);
  bot.addColorStop(0, `rgba(5,8,18,${0.66 * s})`);
  bot.addColorStop(1, 'rgba(5,8,18,0)');
  ctx.fillStyle = bot;
  ctx.fillRect(0, H * 0.78, W, H * 0.22);
}

function drawGrain() {
  if (CFG.grain <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.16 * CFG.grain;
  ctx.fillStyle = noiseTile();
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* ---------- editorial furniture ---------- */
function drawCropMarks() {
  const L = 26, o = 34;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.20)';
  ctx.lineWidth = 1;
  const corners = [
    [o, o, 1, 1], [W - o, o, -1, 1],
    [o, H - o, 1, -1], [W - o, H - o, -1, -1],
  ];
  for (const [x, y, sx, sy] of corners) {
    ctx.beginPath();
    ctx.moveTo(x, y + sy * L);
    ctx.lineTo(x, y);
    ctx.lineTo(x + sx * L, y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawLabel() {
  ctx.save();
  ctx.font = '500 13px "IBM Plex Sans Arabic", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.58)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // manual tracking, Latin only
  const track = 2.6;
  let x = MARGIN;
  for (const ch of CFG.label) {
    ctx.fillText(ch, x, 106);
    x += ctx.measureText(ch).width + track;
  }
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(MARGIN, 140);
  ctx.lineTo(W - MARGIN, 140);
  ctx.stroke();
  ctx.restore();
}

/* ---------- headline ---------- */
function drawHeadline() {
  ctx.save();
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = 30;
  ctx.shadowOffsetY = 6;

  const rightEdge = W - MARGIN;
  let last = null;

  for (const line of CFG.headline) {
    ctx.font = `${line.weight} ${line.size}px "IBM Plex Sans Arabic", system-ui, sans-serif`;
    ctx.fillStyle = line.color === 'accent' ? CFG.accent : line.color;
    ctx.globalAlpha = line.alpha;
    ctx.fillText(line.text, rightEdge, line.baseline);
    last = { ...line, width: ctx.measureText(line.text).width };
  }
  ctx.restore();

  // hairline beneath the final line, measured so it tracks the text
  if (last) {
    ctx.save();
    ctx.strokeStyle = CFG.accent;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const y = last.baseline + 26;
    ctx.moveTo(W - MARGIN, y);
    ctx.lineTo(W - MARGIN - last.width, y);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- hand annotations ---------- */
function drawAnnotations() {
  ctx.save();
  ctx.strokeStyle = CFG.accent;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 1. a small bracket beside the headline, as if drawn in the margin
  ctx.globalAlpha = 0.34;
  ctx.beginPath();
  ctx.moveTo(W - MARGIN + 26, 236);
  ctx.bezierCurveTo(W - MARGIN + 32, 268, W - MARGIN + 30, 330, W - MARGIN + 24, 368);
  ctx.stroke();

  // 2. a loose arrow sweeping from the quiet top area down toward the desk
  ctx.globalAlpha = 0.28;
  ctx.beginPath();
  ctx.moveTo(MARGIN + 6, 214);
  ctx.bezierCurveTo(MARGIN + 30, 262, MARGIN + 44, 330, MARGIN + 30, 392);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(MARGIN + 30, 392);
  ctx.lineTo(MARGIN + 21, 374);
  ctx.moveTo(MARGIN + 30, 392);
  ctx.lineTo(MARGIN + 40, 376);
  ctx.stroke();

  ctx.restore();
}

/* ---------- swipe ---------- */
function drawSwipe() {
  if (!CFG.swipe) return;
  const y = H - 92;
  ctx.save();
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.font = '400 20px "IBM Plex Sans Arabic", system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.fillText(CFG.swipeText, W - MARGIN, y + 7);

  const tw = ctx.measureText(CFG.swipeText).width;
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const ax = W - MARGIN - tw - 22;
  ctx.moveTo(ax, y);
  ctx.lineTo(ax - 30, y);
  ctx.moveTo(ax - 30, y);
  ctx.lineTo(ax - 21, y - 8);
  ctx.moveTo(ax - 30, y);
  ctx.lineTo(ax - 21, y + 8);
  ctx.stroke();
  ctx.restore();
}

/* ---------- compose ---------- */
function render() {
  ctx.clearRect(0, 0, W, H);
  if (frame) drawCover(frame); else drawPlaceholder();
  drawVignette();
  drawScrims();
  drawGrain();
  drawCropMarks();
  drawLabel();
  drawHeadline();
  drawAnnotations();
  drawSwipe();
}

/* ---------- input ---------- */
async function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.src = url;
  await img.decode();
  frame = img;
  empty.classList.add('hide');
  render();
}

const fileInput = document.getElementById('file');
document.getElementById('pick').onclick = () => fileInput.click();
fileInput.onchange = e => loadFile(e.target.files[0]);

wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('dragover'); });
wrap.addEventListener('dragleave', () => wrap.classList.remove('dragover'));
wrap.addEventListener('drop', e => {
  e.preventDefault();
  wrap.classList.remove('dragover');
  loadFile(e.dataTransfer.files[0]);
});

document.addEventListener('paste', e => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

document.getElementById('scrim').oninput = e => { CFG.scrim = e.target.value / 100; render(); };
document.getElementById('grain').oninput = e => { CFG.grain = e.target.value / 100; render(); };
document.getElementById('swipe').onchange = e => { CFG.swipe = e.target.checked; render(); };

const ACCENTS = { gold: '#E9B872', blue: '#4C74FF', white: '#FFFFFF' };
document.getElementById('swatches').onclick = e => {
  const btn = e.target.closest('.swatch');
  if (!btn) return;
  CFG.accent = ACCENTS[btn.dataset.accent];
  [...e.currentTarget.children].forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  render();
};

/* ---------- export ---------- */
document.getElementById('save').onclick = async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = 'Rendering…';
  try {
    await document.fonts.ready;
    render();
    const png = await new Promise(r => cv.toBlob(r, 'image/png'));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(png);
    a.download = 'ig-cover-cinematic-1080x1350.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    btn.textContent = 'Saved ✓';
  } catch (err) {
    console.error(err);
    btn.textContent = 'Export failed';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = 'Download PNG'; }, 1800);
};

/* ---------- boot ---------- */
(async () => {
  try {
    await Promise.all([
      document.fonts.load('600 62px "IBM Plex Sans Arabic"'),
      document.fonts.load('700 82px "IBM Plex Sans Arabic"'),
      document.fonts.load('400 20px "IBM Plex Sans Arabic"'),
      document.fonts.load('500 13px "IBM Plex Sans Arabic"'),
    ]);
  } catch (_) {}
  render();
})();
</script>
</body>
</html>
